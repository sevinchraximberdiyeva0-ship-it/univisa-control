name: UniVisa checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
      REQUIRE_REDIS_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run test:integration
      - run: npm run build
      - run: npm audit --audit-level=moderate
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and smoke-test isolated Docker deployment
        run: |
          node --test scripts/docker-smoke.test.mjs
          node scripts/docker-smoke.mjs
      - name: Save redacted Docker test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-smoke-results
          path: |
            test-results/univisa-smoke-*/result.json
            test-results/univisa-smoke-*/diagnostics.log
          if-no-files-found: ignore
